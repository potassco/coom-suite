[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "coomsuite"
authors = [{ name = "Nicolas Rühling", email = "nruehling@uni-potsdam.de" }]
description = "Python package to parse and solve COOM configuration instances using ASP."
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "clingo==5.7.*",
    "flingo==1.0.0",
    "clinguin>=2.6.1",
]
license-files = ["LICENSE"]
dynamic = ["version"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/potassco/coom-suite.git/"
Documentation = "https://docs.potassco.org/coom-suite/"
Repository = "https://github.com/potassco/coom-suite"
Issues = "https://github.com/potassco/coom-suite/issues"
Changelog = "https://github.com/potassco/coom-suite/blob/master/CHANGES.md"

[project.optional-dependencies]
# format = ["black", "isort", "autoflake"]
# lint_pylint = ["pylint"]
# typecheck = ["types-setuptools", "mypy"]
# test = ["coverage[toml]", "clintest>=0.2.0"]
lint = ["ruff"]
typecheck = ["pytest", "ty"]
test = ["pytest", "pytest-cov", "coverage[toml]", "clintest"]
doc = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0",
    "clindocs>=1.5.3",
    "mkdocs-literate-nav",
    "pygments_clingo",
]
grammar = ["antlr4-tools"]
dev = ["coomsuite[test,typecheck,lint,grammar]"]

[project.scripts]
coomsuite = "coomsuite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120


[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "/usr/**",
    "**/site-packages/**",
    "**/node_modules/**",
    "**/typeshed-fallback/**",
    "**/coom_grammar/**",
]

[tool.ruff.lint]
extend-select = ["I", "E", "F", "B", "C4", "D", "ARG", "SIM", "ANN", "Q"]
ignore = [
    "E741",
    "D200",
    "D203",
    "D212",
    "D413",
    "B023", # broken lint
]

[tool.ruff.lint.per-file-ignores]
"noxfile.py" = ["ANN"]

# [tool.pylint.format]
# max-line-length = 120

# [tool.pylint.design]
# max-args = 5
# max-positional-arguments = 5
# max-attributes = 8
# max-bool-expr = 5
# max-branches = 12
# max-locals = 30
# max-parents = 7
# max-public-methods = 20
# max-returns = 10
# max-statements = 50
# min-public-methods = 1

# [tool.pylint.similarities]
# ignore-comments = true
# ignore-docstrings = true
# ignore-imports = true
# ignore-signatures = true

# [tool.pylint.basic]
# argument-rgx = "^[a-z][a-z0-9]*((_[a-z0-9]+)*_?)?$"
# variable-rgx = "^[a-z][a-z0-9]*((_[a-z0-9]+)*_?)?$"
# good-names = ["_"]

# [tool.pylint.MASTER]
# ignore = ["coom_grammar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["coomsuite", "tests"]
omit = [
    "*/coomsuite/__main__.py",
    "*/coomsuite/utils/logging.py",
    "*/coom_grammar/*",
    "*/tests/__init__.py",
    "ui_backend.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "raise NotImplementedError",
    "raise TypeError",
    "nocoverage",
    "assert",
    "\\.\\.\\.",
]

[tool.ty.src]
exclude = ["noxfile.py", "**/coom_grammar/**"]
