repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^src/coomsuite/utils/coom_grammar/
      - id: ruff-format
        exclude: ^src/coomsuite/utils/coom_grammar/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^(.github/|src/coomsuite/utils/coom_grammar/)

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "79"]
        exclude: ^docs/
        additional_dependencies:
          - mdformat-gfm

  - repo: https://github.com/allganize/ty-pre-commit
    rev: v0.0.46
    hooks:
      - id: ty-check
        args: ["--ignore", "unresolved-import"]
        exclude: "^(noxfile\\.py$|src/coomsuite/utils/coom_grammar/)"
        additional_dependencies: ["pytest"]
